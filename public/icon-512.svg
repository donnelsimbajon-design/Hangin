<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbebd6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Decorative Breeze Wind Curves -->
  <path d="M 80 160 C 180 120, 260 200, 360 170 C 410 155, 430 130, 450 140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 60 240 C 140 210, 220 270, 320 240 C 370 225, 410 200, 440 210" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
  <!-- Central Leaf Emblem with Shadow -->
  <g filter="url(#shadow)">
    <!-- Gentle Leaf Form -->
    <path d="M 256 120 C 360 140, 410 240, 370 340 C 330 420, 240 430, 190 390 C 140 350, 130 260, 160 190 C 180 140, 220 120, 256 120 Z" fill="url(#leafGrad)"/>
    <!-- Leaf Stem & Veins -->
    <path d="M 256 140 Q 250 280 200 400" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
    <path d="M 250 230 Q 300 210 330 220" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <path d="M 245 280 Q 295 270 325 290" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <path d="M 235 330 Q 285 330 305 355" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M 245 250 Q 200 235 180 240" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M 230 310 Q 190 300 170 315" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Paw Print Inside Leaf Base -->
  <g fill="#047857" opacity="0.85">
    <ellipse cx="230" cy="340" rx="14" ry="11"/>
    <circle cx="215" cy="320" r="5"/>
    <circle cx="228" cy="314" r="5"/>
    <circle cx="242" cy="318" r="5"/>
  </g>
</svg>
